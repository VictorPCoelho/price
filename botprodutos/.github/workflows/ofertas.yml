name: Bot de Ofertas

on:
  schedule:
    - cron: "*/10 * * * *"   # a cada 10 minutos (GitHub pode atrasar alguns min)
  workflow_dispatch:          # botão "Run workflow" para testar manualmente

permissions:
  contents: write             # necessário para commitar o data/seen.json

concurrency:
  group: ofertas-bot
  cancel-in-progress: false

jobs:
  postar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Buscar e postar ofertas
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AMAZON_TAG: ${{ secrets.AMAZON_TAG }}
        run: python main.py

      - name: Salvar histórico de posts (dedupe)
        run: |
          if ! git diff --quiet data/seen.json 2>/dev/null; then
            git config user.name "ofertas-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/seen.json
            git commit -m "bot: atualiza ofertas postadas [skip ci]"
            git pull --rebase origin ${GITHUB_REF_NAME} || true
            git push
          fi
