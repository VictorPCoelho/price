<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Maestro de Estudos{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topo">
    <div class="container barra">
      <span class="marca">🎯 Maestro</span>
      <nav>
        <a href="/painel" class="{{ 'ativo' if ativo_nav == 'painel' }}">Painel</a>
        <a href="/estudar" class="{{ 'ativo' if ativo_nav == 'estudar' }}">Estudar agora</a>
        <a href="/edital" class="{{ 'ativo' if ativo_nav == 'edital' }}">Edital</a>
        <a href="/ciclo" class="{{ 'ativo' if ativo_nav == 'ciclo' }}">Ciclo</a>
        <a href="/sessoes" class="{{ 'ativo' if ativo_nav == 'sessoes' }}">Sessões</a>
        <a href="/concursos" class="{{ 'ativo' if ativo_nav == 'concursos' }}">Concursos</a>
      </nav>
      {% if concurso %}<span class="pilula">{{ concurso.nome }}</span>{% endif %}
    </div>
  </header>
  <main class="container">
    {% block conteudo %}{% endblock %}
  </main>
</body>
</html>
